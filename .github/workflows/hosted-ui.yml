# TEMPORARY measurement branch for #124 acceptance (not for merge): baseline 05fe629 + exported scroll harness
# vs candidate b5284c0 on one runner at 1920x1080, alternating runs, with desktop recordings.
name: hosted-ui
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure-124:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'
      - name: Set the PMO display size (1920x1080)
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Prepare baseline (05fe629 + exported test-only scroll harness)
        shell: pwsh
        run: |
          ./scripts/Export-PlanScrollHarness.ps1 -Baseline 05fe629 -OutputPath ../plan-scroll-harness
          git worktree add --detach ../base 05fe629
          $suite = 'tests/GhProjectsBoards.UiIntegration.Tests'
          foreach ($file in 'PlanSheetHostedTests.cs', 'PlanSheetScrollPerformanceTests.cs') {
              Copy-Item -LiteralPath "../plan-scroll-harness/$suite/$file" -Destination "../base/$suite/$file"
          }
          git -C ../base diff --stat
          New-Item -ItemType Directory -Force measure-out | Out-Null
          Copy-Item ../plan-scroll-harness/manifest.json measure-out/baseline-overlay-manifest.json
      - name: Build candidate and baseline
        shell: pwsh
        run: |
          dotnet build GhProjectsBoards.sln --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'candidate build failed' }
          dotnet build ../base/GhProjectsBoards.sln --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'baseline build failed' }
      - name: Get ffmpeg for desktop recordings
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null }
          ffmpeg -version | Select-Object -First 1
      - name: Measure alternately (baseline, candidate, baseline, candidate)
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'measure-out'
          New-Item -ItemType Directory -Force $out | Out-Null
          $ffmpeg = (Get-Command ffmpeg -ErrorAction SilentlyContinue)?.Source
          foreach ($pass in 1, 2) {
            foreach ($side in 'baseline', 'candidate') {
              $root = if ($side -eq 'baseline') { (Resolve-Path ../base).Path } else { $env:GITHUB_WORKSPACE }
              $name = "$side-$pass"
              $env:GHPB_PLAN_EVIDENCE = Join-Path $out $name
              $rec = $null
              if ($ffmpeg -and $pass -eq 1) {
                $rec = Start-Process $ffmpeg -ArgumentList @('-y','-f','gdigrab','-framerate','30','-i','desktop','-c:v','libx264','-preset','ultrafast','-crf','30','-pix_fmt','yuv420p','-f','matroska', (Join-Path $out "$name.mkv")) -PassThru -WindowStyle Hidden -RedirectStandardError (Join-Path $out "$name-ffmpeg.log")
                Start-Sleep -Seconds 2
              }
              Push-Location $root
              try { ./scripts/Test-UiIntegration.ps1 -NoBuild -Where 'cat == PlanSheetPerformance' -TimeoutSeconds 1800 } catch { Write-Host "$name failed: $_" }
              finally { Pop-Location }
              if ($rec) { Stop-Process -Id $rec.Id -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2 }
              $run = Get-ChildItem (Join-Path $root 'TestResults/ui-integration') -Directory | Sort-Object LastWriteTime | Select-Object -Last 1
              Copy-Item -Recurse $run.FullName (Join-Path $out "$name-run")
              $meta = Get-Content -Raw (Join-Path $run.FullName 'metadata.json') | ConvertFrom-Json
              Write-Host "$name exit=$($meta.exitCode) counts=$($meta.counts | ConvertTo-Json -Compress)"
              Get-ChildItem $env:GHPB_PLAN_EVIDENCE -Filter *.json -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $name $($_.Name)"; Get-Content -Raw $_.FullName | Write-Host }
            }
          }
          Remove-Item Env:\GHPB_PLAN_EVIDENCE
      - name: Native keys, pointer and clipboard (baseline, candidate)
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($side in 'baseline', 'candidate') {
            $root = if ($side -eq 'baseline') { (Resolve-Path ../base).Path } else { $env:GITHUB_WORKSPACE }
            Push-Location $root
            try { ./scripts/Test-UiIntegration.ps1 -NoBuild -Where 'cat == PlanSheetNative' -TimeoutSeconds 1800 } catch { Write-Host "$side native failed: $_" }
            finally { Pop-Location }
            $run = Get-ChildItem (Join-Path $root 'TestResults/ui-integration') -Directory | Sort-Object LastWriteTime | Select-Object -Last 1
            Copy-Item -Recurse $run.FullName (Join-Path $env:GITHUB_WORKSPACE "measure-out/$side-native-run")
            Write-Host "$side native counts=$((Get-Content -Raw (Join-Path $run.FullName 'metadata.json') | ConvertFrom-Json).counts | ConvertTo-Json -Compress)"
          }
      - name: Upload measurements and recordings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-124
          path: measure-out
          if-no-files-found: warn
