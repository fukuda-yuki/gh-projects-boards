# TEMPORARY rerun branch for #124 acceptance (not for merge): suspect hosted tests, baseline 05fe629 vs candidate b5284c0.
name: hosted-ui
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure-124:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'
      - name: Set the PMO display size (1920x1080)
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Prepare baseline (05fe629 + exported test-only scroll harness)
        shell: pwsh
        run: |
          ./scripts/Export-PlanScrollHarness.ps1 -Baseline 05fe629 -OutputPath ../plan-scroll-harness
          git worktree add --detach ../base 05fe629
          $suite = 'tests/GhProjectsBoards.UiIntegration.Tests'
          foreach ($file in 'PlanSheetHostedTests.cs', 'PlanSheetScrollPerformanceTests.cs') {
              Copy-Item -LiteralPath "../plan-scroll-harness/$suite/$file" -Destination "../base/$suite/$file"
          }
          git -C ../base diff --stat
          New-Item -ItemType Directory -Force measure-out | Out-Null
          Copy-Item ../plan-scroll-harness/manifest.json measure-out/baseline-overlay-manifest.json
      - name: Build candidate and baseline
        shell: pwsh
        run: |
          dotnet build GhProjectsBoards.sln --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'candidate build failed' }
          dotnet build ../base/GhProjectsBoards.sln --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'baseline build failed' }
      - name: Rerun the suspect tests five times on each side
        shell: pwsh
        continue-on-error: true
        run: |
          $where = "test =~ /InsertAndIndentRollUpTheParent|ChartWidthChangesKeepVisibleDates|EmptyFilterCancelsPendingText|EnterAppliesFilterBeforePause/"
          foreach ($pass in 1..5) {
            foreach ($side in 'baseline', 'candidate') {
              $root = if ($side -eq 'baseline') { (Resolve-Path ../base).Path } else { $env:GITHUB_WORKSPACE }
              Push-Location $root
              try { ./scripts/Test-UiIntegration.ps1 -NoBuild -Where $where -TimeoutSeconds 900 } catch { Write-Host "$side-$pass failed: $_" }
              finally { Pop-Location }
              $run = Get-ChildItem (Join-Path $root 'TestResults/ui-integration') -Directory | Sort-Object LastWriteTime | Select-Object -Last 1
              Copy-Item -Recurse $run.FullName (Join-Path $env:GITHUB_WORKSPACE "measure-out/rerun-$side-$pass")
              [xml]$x = Get-Content -Raw (Join-Path $run.FullName 'results.xml')
              foreach ($c in $x.SelectNodes('//test-case')) { Write-Host "RERUN $side-$pass $($c.result) $($c.name) $($c.failure.message.'#cdata-section' -replace '\s+',' ')" }
            }
          }
      - name: Upload measurements and recordings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rerun-124
          path: measure-out
          if-no-files-found: warn
