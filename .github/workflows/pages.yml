name: pages
# Builds the management progress site (#271) from deterministic fictional demo records and deploys it to this
# repository's public GitHub Pages. It reads no Project and writes nothing but the Pages artifact; tests belong to
# ci.yml. The published site is fictional demo data only (noindex, デモデータ label).
on:
  push:
    branches: [main]
    paths:
      - 'src/GhProjectsBoards.Core/Reports/**'
      - 'src/GhProjectsBoards.Report/**'
      # The demo is generated from these tracked plans (embedded in the tool), so a plan change changes the site.
      - 'evaluation/version-plan.json'
      - 'evaluation/version-plan-12m.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Pages deployments must not overlap, and a running deployment is never cancelled (cancel-in-progress: false).
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'
      - name: Generate the demo raw records and the site configuration
        run: dotnet run --project src/GhProjectsBoards.Report -c Release -- demo --out demo
      - name: Build the site from the demo records
        run: dotnet run --project src/GhProjectsBoards.Report -c Release -- site --data demo/raw --config demo/site.json --out site
      - name: Upload the site as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
