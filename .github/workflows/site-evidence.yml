name: site-evidence
# Temporary evidence job for the #271 pull request: builds the deterministic demo site and captures 1920x1080
# screenshots plus page-scroll metrics on a Windows runner. Not part of the product; removed before merge.
on:
  push:
    branches: [feature/271-management-site]
    paths:
      - '.github/scripts/site-evidence.mjs'
      - '.github/workflows/site-evidence.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'
      - name: Build the report tool
        run: dotnet build src/GhProjectsBoards.Report/GhProjectsBoards.Report.csproj -c Release
      - name: Generate the demo records and the site
        run: |
          dotnet run --project src/GhProjectsBoards.Report -c Release --no-build -- demo --out demo
          dotnet run --project src/GhProjectsBoards.Report -c Release --no-build -- site --data demo/raw --config demo/site.json --out site
      - name: Install Playwright (uses the runner's installed Chrome)
        run: npm install --no-save playwright-core
      - name: Capture screenshots and layout metrics
        run: node .github/scripts/site-evidence.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-evidence
          path: site-evidence
