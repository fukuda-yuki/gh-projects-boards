<!doctype html><html lang="ja"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline';">
<style>
:root{color-scheme:light dark;font:13px 'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:2;height:32px;width:1868px;display:grid;grid-template-columns:48px 230px 100px 145px 145px 1200px;background:Canvas;align-items:center}header span{padding-left:4px}#days{display:flex}#days span{width:24px;font-size:11px;padding:0;flex-shrink:0}#error:empty{display:none}#error{color:crimson}#viewport{height:100vh;overflow:auto;position:relative}#space{width:1868px;height:32000px;position:relative}.row{position:absolute;display:grid;grid-template-columns:48px 230px 100px 145px 145px 1200px;height:32px;width:1868px;border-bottom:1px solid GrayText;align-items:center}.row input{width:100%;height:30px;font:inherit;border:1px solid transparent;background:Canvas;color:CanvasText;padding:4px}.row input:focus{border-color:Highlight;outline:1px solid Highlight}.date{color:LinkText}svg{overflow:visible;height:32px;width:1200px}.bar{fill:Highlight}.arrow{fill:none;stroke:CanvasText;stroke-width:1}
</style>
<div id="error" role="alert"></div><div id="viewport"><header><span>ID</span><span>タイトル</span><span>Remaining</span><span>Start date</span><span>Target date</span><div id="days" aria-label="10月5日起点"></div></header><div id="space"></div></div>
<script>
const viewport=document.querySelector('#viewport'),space=document.querySelector('#space');let rows=[],revision=0, pendingFocus=null;
for(let i=0;i<50;i++){const label=document.createElement('span');label.textContent=new Date(Date.UTC(2026,9,5+i)).getUTCDate();document.getElementById('days').append(label);}
const day=s=>(Date.parse(s+'T00:00:00Z')-Date.parse('2026-10-05T00:00:00Z'))/86400000*24;
function draw(){
 const first=Math.max(0,Math.floor(viewport.scrollTop/32)-5),last=Math.min(rows.length,first+Math.ceil(viewport.clientHeight/32)+10);
 // Retain a focused native input across scroll; never recycle it into another row.
 const focus=document.activeElement?.closest('.row');
 for(const node of [...space.children])if(node!==focus)node.remove();
 for(let i=first;i<last;i++){
  if(focus&&+focus.dataset.index===i){updateChart(focus,rows[i]);continue;}
  const r=rows[i],node=document.createElement('div');node.className='row';node.dataset.index=i;node.style.top=i*32+'px';
  const id=document.createElement('span');id.textContent=r.id;node.append(id);
  [r.title,String(r.remaining),r.start].forEach((value,c)=>{
   const input=document.createElement('input');input.value=value;input.id=`cell-${i}-${c}`;input.setAttribute('aria-label',`行 ${r.id} ${['タイトル','Remaining','Start date'][c]}`);
   let composing=false,ended=false;
   input.addEventListener('compositionstart',()=>composing=true);
   input.addEventListener('compositionend',()=>{composing=false;ended=true;setTimeout(()=>ended=false,0)});
   input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!composing&&!ended&&!e.isComposing&&e.keyCode!==229){e.preventDefault();pendingFocus=[Math.min(999,i+1),c];window.chrome.webview.postMessage({kind:'edit',index:i,column:c,value:input.value,started:performance.now()});}});
   node.append(input);
  });
  const end=document.createElement('span');end.className='date';end.id=`end-${i}`;node.append(end);
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');node.append(svg);updateChart(node,r);space.append(node);
 }
}
function updateChart(node,r){
 node.querySelector('.date').textContent=r.end;const svg=node.querySelector('svg');svg.replaceChildren();
 if(r.predecessor){const x=day(rows[r.id-2].end),to=day(r.start),p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d',`M ${x} -16 H ${x+5} V 16 H ${to} m -4 -4 l 4 4 -4 4`);p.setAttribute('class','arrow');svg.append(p);}
 const bar=document.createElementNS(svg.namespaceURI,'rect');bar.id=`bar-${r.id-1}`;bar.setAttribute('x',day(r.start));bar.setAttribute('y',9);bar.setAttribute('width',Math.max(3,day(r.end)-day(r.start)));bar.setAttribute('height',14);bar.setAttribute('class','bar');svg.append(bar);
}
viewport.addEventListener('scroll',draw);window.addEventListener('resize',draw);
window.chrome.webview.addEventListener('message',e=>{
 if(e.data.error){document.querySelector('#error').textContent=e.data.error;pendingFocus=null;return;}
 document.querySelector('#error').textContent='';rows=e.data.rows;revision=e.data.revision;draw();
 if(pendingFocus){const [i,c]=pendingFocus;pendingFocus=null;if(i*32<viewport.scrollTop||(i+1)*32>viewport.scrollTop+viewport.clientHeight)viewport.scrollTop=i*32;draw();document.getElementById(`cell-${i}-${c}`)?.focus();document.getElementById(`cell-${i}-${c}`)?.select();draw();}
 const renderedRevision=revision;requestAnimationFrame(()=>requestAnimationFrame(()=>{if(revision===renderedRevision)window.chrome.webview.postMessage({kind:'rendered',revision:renderedRevision,elapsedMs:e.data.started===null?null:performance.now()-e.data.started});}));
});
</script></html>
